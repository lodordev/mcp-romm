[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-romm"
version = "1.4.0"
description = "MCP server for RomM — browse and manage your retro game library with AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0,<4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
romm-mcp = "server:mcp.run"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pinned on purpose: ruff's defaults change between releases and CI must not.
select = ["E4", "E7", "E9", "F", "B", "S", "I", "PLE", "RUF100"]
ignore = [
    "S101",  # asserts — this is a test-heavy project
    "S104",  # "0.0.0.0" appears in tests of the bind-address parsing
    "S105", "S106",  # fake credentials in tests
    "B008",  # function calls in argument defaults (FastMCP-style signatures)
]

[tool.ruff.lint.per-file-ignores]
"smoke_test.py" = ["BLE001"]
